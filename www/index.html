
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Neon Runner 3D</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#050816;color:#00f5ff;font-family:Arial,sans-serif;text-align:center;overflow:hidden;touch-action:manipulation}
h1{font-size:clamp(25px,7vw,38px);margin:14px 0 5px;text-shadow:0 0 15px #00eaff}
#hud{display:flex;justify-content:space-around;padding:10px;font-size:17px;font-weight:bold}
canvas{display:block;width:100%;height:62vh;max-height:650px;border-top:2px solid #00f5ff;border-bottom:2px solid #00f5ff;background:#080d20;touch-action:none}
#message{position:absolute;top:44%;left:0;width:100%;font-size:25px;font-weight:bold;text-shadow:0 0 12px #00f5ff;pointer-events:none}
#start{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);padding:15px 27px;background:#00f5ff;color:#04101c;border:0;border-radius:12px;font-weight:bold;font-size:18px}
.controls{display:flex;justify-content:center;gap:12px;padding:13px}
.controls button{width:76px;height:53px;background:#101c36;border:2px solid #00f5ff;border-radius:12px;color:#00f5ff;font-size:23px}
#hint{font-size:12px;color:#a6c7e9;margin:0}
</style>
</head>
<body>
<h1>NEON RUNNER 3D</h1>
<div id="hud">
<span>🏆 <span id="score">0</span></span>
<span>BEST: <span id="best">0</span></span>
<span>❤️ <span id="lives">3</span></span>
</div>
<div style="position:relative">
<canvas id="game"></canvas>
<div id="message">READY TO RUN?</div>
<button id="start">START GAME</button>
</div>
<div class="controls">
<button id="left" aria-label="Move left">◀</button>
<button id="jump" aria-label="Jump">⬆</button>
<button id="right" aria-label="Move right">▶</button>
</div>
<p id="hint">Switch lanes • Jump over obstacles • Avoid collisions</p>
<script>
(function(){
const canvas=document.getElementById('game');
const ctx=canvas.getContext('2d');
const scoreEl=document.getElementById('score');
const bestEl=document.getElementById('best');
const livesEl=document.getElementById('lives');
const message=document.getElementById('message');
const startBtn=document.getElementById('start');

let W=360,H=500,dpr=1;
let running=false, lane=1, jump=0, jumpV=0;
let obstacles=[], score=0, lives=3, speed=230, spawn=0;
let last=0, hitFlash=0;
let best=0;
try{best=Number(localStorage.getItem('neonBest')||0)}catch(e){}
bestEl.textContent=best;

function resize(){
 const r=canvas.getBoundingClientRect();
 dpr=Math.min(window.devicePixelRatio||1,2);
 W=r.width; H=r.height;
 canvas.width=Math.round(W*dpr);
 canvas.height=Math.round(H*dpr);
 ctx.setTransform(dpr,0,0,dpr,0,0);
 draw();
}
window.addEventListener('resize',resize);

function roadAt(t){
 return {x:W/2, y:H*.16+t*H*.94,
 width:W*(.12+.78*t)};
}
function draw(){
 ctx.clearRect(0,0,W,H);
 const bg=ctx.createLinearGradient(0,0,0,H);
 bg.addColorStop(0,'#080b20');bg.addColorStop(1,'#101735');
 ctx.fillStyle=bg;ctx.fillRect(0,0,W,H);

 // Neon city skyline
 for(let i=0;i<12;i++){
  let bw=W/10, bx=i*bw-5;
  let bh=H*(.08+((i*37)%19)/100);
  ctx.fillStyle=i%2?'#101b3a':'#11112f';
  ctx.fillRect(bx,H*.25-bh,bw-4,bh);
  ctx.fillStyle='#164c75';
  for(let y=H*.25-bh+8;y<H*.25-3;y+=13)
   for(let x=bx+6;x<bx+bw-5;x+=12)
    ctx.fillRect(x,y,3,4);
 }
 // Perspective road
 const top=roadAt(0), bottom=roadAt(1);
 ctx.beginPath();
 ctx.moveTo(top.x-top.width/2,top.y);
 ctx.lineTo(top.x+top.width/2,top.y);
 ctx.lineTo(bottom.x+bottom.width/2,bottom.y);
 ctx.lineTo(bottom.x-bottom.width/2,bottom.y);
 ctx.closePath();ctx.fillStyle='#11182c';ctx.fill();
 ctx.strokeStyle='#00f5ff';ctx.lineWidth=2;
 ctx.beginPath();ctx.moveTo(top.x-top.width/2,top.y);ctx.lineTo(bottom.x-bottom.width/2,bottom.y);ctx.stroke();
 ctx.beginPath();ctx.moveTo(top.x+top.width/2,top.y);ctx.lineTo(bottom.x+bottom.width/2,bottom.y);ctx.stroke();

 // Lane lines
 for(let l=1;l<=2;l++){
  for(let k=0;k<10;k++){
   let t=((k/10+(running?score*.0008:0))%1);
   let a=roadAt(t),b=roadAt(Math.min(1,t+.045));
   let x1=W/2+(l-1.5)*a.width/3;
   let x2=W/2+(l-1.5)*b.width/3;
   ctx.strokeStyle='#087fba';ctx.lineWidth=1+t*2;
   ctx.beginPath();ctx.moveTo(x1,a.y);ctx.lineTo(x2,b.y);ctx.stroke();
  }
 }
 // Obstacles
 obstacles.forEach(o=>{
  let t=o.z, p=roadAt(t);
  let x=W/2+(o.lane-1)*p.width/3;
  let size=9+t*35;
  ctx.save();ctx.shadowBlur=14;ctx.shadowColor=o.type==='block'?'#ff2bd6':'#ffcf40';
  if(o.type==='block'){
   ctx.fillStyle='#ff2bd6';
   ctx.fillRect(x-size/2,p.y-size,size,size);
   ctx.strokeStyle='#ffd9ff';ctx.strokeRect(x-size/2,p.y-size,size,size);
  }else{
   ctx.fillStyle='#ffcf40';
   ctx.beginPath();ctx.moveTo(x,p.y-size);ctx.lineTo(x-size*.65,p.y);ctx.lineTo(x+size*.65,p.y);ctx.closePath();ctx.fill();
  }
  ctx.restore();
 });
 // Runner shadow
 const baseY=H*.82;
 const playerX=W/2+(lane-1)*W*.25;
 ctx.fillStyle='#02040a';
 ctx.beginPath();ctx.ellipse(playerX,baseY+4,19,6,0,0,Math.PI*2);ctx.fill();
 // Runner
 const py=baseY-jump;
 ctx.save();ctx.shadowBlur=18;ctx.shadowColor='#00f5ff';
 ctx.fillStyle='#00f5ff';
 ctx.fillRect(playerX-9,py-37,18,23);
 ctx.fillStyle='#f2ffff';
 ctx.fillRect(playerX-6,py-32,4,4);ctx.fillRect(playerX+2,py-32,4,4);
 ctx.strokeStyle='#00f5ff';ctx.lineWidth=6;ctx.lineCap='round';
 ctx.beginPath();ctx.moveTo(playerX-5,py-12);ctx.lineTo(playerX-11,py);ctx.moveTo(playerX+5,py-12);ctx.lineTo(playerX+11,py);ctx.stroke();
 ctx.restore();
 if(hitFlash>0){ctx.fillStyle='rgba(255,20,90,.18)';ctx.fillRect(0,0,W,H)}
}
function move(d){if(running)lane=Math.max(0,Math.min(2,lane+d))}
function doJump(){if(running&&jump<=0){jumpV=430}}
document.getElementById('left').onclick=()=>move(-1);
document.getElementById('right').onclick=()=>move(1);
document.getElementById('jump').onclick=doJump;

let sx=0,sy=0;
canvas.addEventListener('touchstart',e=>{
 sx=e.changedTouches[0].clientX;sy=e.changedTouches[0].clientY;
},{passive:true});
canvas.addEventListener('touchend',e=>{
 if(!running)return;
 let dx=e.changedTouches[0].clientX-sx;
 let dy=e.changedTouches[0].clientY-sy;
 if(Math.abs(dx)>25){move(dx>0?1:-1)}
 else if(dy < -20){doJump()}
},{passive:true});
window.addEventListener('keydown',e=>{
 if(e.key==='ArrowLeft'||e.key==='a')move(-1);
 if(e.key==='ArrowRight'||e.key==='d')move(1);
 if(e.key==='ArrowUp'||e.key===' ')doJump();
});

function endGame(){
 running=false;
 message.textContent='GAME OVER — SCORE '+Math.floor(score);
 message.style.display='block';startBtn.textContent='PLAY AGAIN';
 startBtn.style.display='block';
 if(score>best){
  best=Math.floor(score);bestEl.textContent=best;
  try{localStorage.setItem('neonBest',best)}catch(e){}
 }
}
function update(dt){
 if(!running)return;
 score+=dt*10;speed=Math.min(440,230+score*.35);
 scoreEl.textContent=Math.floor(score);
 if(jump>0||jumpV>0){
  jump+=jumpV*dt;jumpV-=1000*dt;
  if(jump<=0){jump=0;jumpV=0}
 }
 spawn-=dt;
 if(spawn<=0){
  obstacles.push({lane:Math.floor(Math.random()*3),z:0,type:Math.random()<.5?'block':'cone'});
  spawn=Math.max(.48,1.15-score*.002)+Math.random()*.45;
 }
 obstacles.forEach(o=>o.z+=dt*speed/430);
 obstacles=obstacles.filter(o=>{
  if(o.z>.83&&o.z<.98&&o.lane===lane&&!o.hit){
   if(jump<35){
    o.hit=true;lives--;livesEl.textContent=lives;hitFlash=.18;
    if(lives<=0)endGame();
   }else o.hit=true;
  }
  return o.z<1.1;
 });
 hitFlash=Math.max(0,hitFlash-dt);
}
function loop(t){
 let dt=Math.min((t-last)/1000||0,.04);last=t;
 update(dt);draw();requestAnimationFrame(loop);
}
startBtn.onclick=()=>{
 score=0;lives=3;lane=1;jump=0;jumpV=0;
 speed=230;spawn=.5;obstacles=[];hitFlash=0;
 scoreEl.textContent='0';livesEl.textContent='3';
 running=true;message.style.display='none';startBtn.style.display='none';
};
resize();requestAnimationFrame(loop);
})();
</script>
</body>
</html>
